<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Alumnos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">Formulario de Alumnos</h1>

        <form>

            <!-- Nombre -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nombre" placeholder="Nombre">
                <label for="nombre">Nombre completo</label>
            </div>

            <!-- Matrícula -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="matricula" placeholder="Matrícula">
                <label for="matricula">Matrícula</label>
            </div>

            <!-- Correo -->
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com">
                <label for="correo">Correo electrónico</label>
            </div>

            <!-- Teléfono -->
            <div class="form-floating mb-3">
                <input type="tel" class="form-control" id="telefono" placeholder="Teléfono">
                <label for="telefono">Teléfono</label>
            </div>

            <!-- Carrera -->
            <div class="form-floating mb-3">
                <select class="form-select" id="carrera">
                    <option selected>Selecciona una carrera</option>
                    <option value="1">ITICS</option>
                    <option value="2">Ingeniería en Sistemas</option>
                    <option value="3">Informática</option>
                </select>
                <label for="carrera">Carrera</label>
            </div>

            <!-- Semestre -->
            <div class="form-floating mb-3">
                <select class="form-select" id="semestre">
                    <option selected>Selecciona un semestre</option>
                    <option value="1">1°</option>
                    <option value="2">2°</option>
                    <option value="3">3°</option>
                    <option value="4">4°</option>
                    <option value="5">5°</option>
                    <option value="6">6°</option>
                    <option value="7">7°</option>
                    <option value="8">8°</option>
                    <option value="9">9°</option>
                </select>
                <label for="semestre">Semestre</label>
            </div>

            <!-- Fecha -->
            <div class="form-floating mb-3">
                <input type="date" class="form-control" id="fecha">
                <label for="fecha">Fecha de nacimiento</label>
            </div>

            <!-- Comentarios -->
            <div class="form-floating mb-3">
                <textarea class="form-control" placeholder="Comentarios" id="comentarios" style="height: 100px"></textarea>
                <label for="comentarios">Comentarios</label>
            </div>

            <!-- Botones -->
            <button type="submit" class="btn btn-primary">Enviar</button>
            <button type="reset" class="btn btn-secondary">Limpiar</button>

        </form>

    </div>

</body>
</html>
